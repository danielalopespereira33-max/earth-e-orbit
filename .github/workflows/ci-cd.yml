name: CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes e JAR
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: earth-e-orbit-jar
          path: target/earth-e-orbit.jar

  docker:
    name: docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir nome da imagem
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/earth-e-orbit" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest

  staging:
    name: staging
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: staging
  
    steps:
      - uses: actions/checkout@v4
      - name: Copiar arquivos de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.staging.yml,scripts/earth_orbit_mongodb.js"
          target: "earth-orbit/staging"
      - name: Deploy em staging
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ needs.docker.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            cd earth-orbit/staging
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f deploy/docker-compose.staging.yml pull api
            docker compose -f deploy/docker-compose.staging.yml up -d
      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.DEPLOY_HOST }}:8081/api/health" | grep -q '"UP"'; then
              echo "staging UP"; exit 0
            fi
            echo "aguardando... ($i)"; sleep 10
          done
          echo "staging nao respondeu UP"; exit 1

  production:
    name: production
    needs: [docker, staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
      - uses: actions/checkout@v4
      - name: Copiar arquivos de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.production.yml,scripts/earth_orbit_mongodb.js"
          target: "earth-orbit/production"
      - name: Deploy em production
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ needs.docker.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            cd earth-orbit/production
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f deploy/docker-compose.production.yml pull api
            docker compose -f deploy/docker-compose.production.yml up -d
      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ secrets.DEPLOY_HOST }}:8082/api/health" | grep -q '"UP"'; then
              echo "production UP"; exit 0
            fi
            echo "aguardando... ($i)"; sleep 10
          done
          echo "production nao respondeu UP"; exit 1
