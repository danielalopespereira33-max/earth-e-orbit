name: CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes e JAR
        run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: earth-e-orbit-jar
          path: target/earth-e-orbit.jar

  docker:
    name: docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir nome da imagem
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/earth-e-orbit" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest


  staging:
    name: staging
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      IMAGE_TAG: ${{ needs.docker.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy em staging (Docker Compose, porta 8081)
        run: |
          docker compose -f deploy/docker-compose.staging.yml pull api
          docker compose -f deploy/docker-compose.staging.yml up -d
          docker compose -f deploy/docker-compose.staging.yml ps
      - name: Smoke test /api/health (staging)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://localhost:8081/api/health" | tee /tmp/health.json | grep -q '"UP"'; then
              echo ""
              echo "=== staging UP (porta 8081) ==="
              cat /tmp/health.json
              echo ""
              exit 0
            fi
            echo "aguardando... ($i)"; sleep 10
          done
          echo "staging nao respondeu UP"
          docker compose -f deploy/docker-compose.staging.yml logs --tail=100
          exit 1
      - name: Encerrar ambiente
        if: always()
        run: docker compose -f deploy/docker-compose.staging.yml down -v

  production:
    name: production
    needs: [docker, staging]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      IMAGE_TAG: ${{ needs.docker.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy em production (Docker Compose, porta 8082)
        run: |
          docker compose -f deploy/docker-compose.production.yml pull api
          docker compose -f deploy/docker-compose.production.yml up -d
          docker compose -f deploy/docker-compose.production.yml ps
      - name: Smoke test /api/health (production)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://localhost:8082/api/health" | tee /tmp/health.json | grep -q '"UP"'; then
              echo ""
              echo "=== production UP (porta 8082) ==="
              cat /tmp/health.json
              echo ""
              exit 0
            fi
            echo "aguardando... ($i)"; sleep 10
          done
          echo "production nao respondeu UP"
          docker compose -f deploy/docker-compose.production.yml logs --tail=100
          exit 1
      - name: Encerrar ambiente
        if: always()
        run: docker compose -f deploy/docker-compose.production.yml down -v
